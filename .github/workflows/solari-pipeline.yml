name: Solari Career Pipeline

on:
  schedule:
    # Run at 8:00 AM UTC every day
    - cron: '0 8 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the JSON files back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: ./examples/ai-career-pipeline
        run: pip install -r requirements.txt

      - name: Run Solari Pipeline
        working-directory: ./examples/ai-career-pipeline
        env:
          SOLARI_API_KEY: ${{ secrets.SOLARI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python solari_pipeline.py

      - name: Copy latest jobs and Commit
        run: |
          # Find the latest daily json and copy it for the frontend
          LATEST_FILE=$(ls -t examples/ai-career-pipeline/job_data/daily/*.json 2>/dev/null | head -n 1)
          if [ -n "$LATEST_FILE" ]; then
            cp "$LATEST_FILE" examples/ai-career-pipeline/latest_jobs.json
          fi
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add examples/ai-career-pipeline/job_data/
          git add examples/ai-career-pipeline/latest_jobs.json || true
          git commit -m "Auto-update ATS jobs via Solari" || echo "No changes to commit"
          git push
